<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpticGrid | Analysis Center</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #C5A059; --cream: #FDFBF7; --text: #2C2C2C; --border: #E5D5B7; }
        body { background: var(--cream); color: var(--text); font-family: 'Poppins', sans-serif; margin: 0; overflow-x: hidden; }

        /* MODAL: Müşteri Kayıt */
        #entry-modal { position: fixed; inset: 0; background: var(--cream); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .modal-box { background: #fff; padding: 50px 40px; border-radius: 40px; width: 90%; max-width: 400px; border: 1px solid var(--border); text-align: center; }
        .modal-title { font-family: 'Playfair Display', serif; color: var(--gold); font-size: 2rem; margin-bottom: 30px; }
        .modal-box input, .modal-box select { width: 100%; padding: 18px; margin-bottom: 20px; border-radius: 15px; border: 1px solid #eee; background: #fafafa; font-size: 1rem; box-sizing: border-box; }
        .btn-go { background: var(--gold); color: #fff; border: none; padding: 20px; border-radius: 50px; width: 100%; font-weight: 600; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; }

        /* MAIN CONTENT */
        #main-content { display: none; text-align: center; padding: 40px 20px; }
        .vogue-logo { font-family: 'Playfair Display', serif; font-size: 2.5rem; color: var(--gold); letter-spacing: 10px; text-transform: uppercase; margin-bottom: 30px; }
        .cam-container { position: relative; width: 100%; max-width: 450px; margin: 0 auto; border: 10px solid #fff; border-radius: 50px; overflow: hidden; box-shadow: 0 25px 50px rgba(0,0,0,0.1); background: #000; }
        video { width: 100%; display: block; transform: scaleX(-1); }
        .cam-btn { position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.9); border: none; padding: 12px; border-radius: 50%; cursor: pointer; font-size: 1.5rem; z-index: 10; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .btn-analyze { background: var(--gold); color: #fff; border: none; padding: 20px 60px; font-size: 1.1rem; font-weight: 600; cursor: pointer; border-radius: 50px; margin: 30px 0; letter-spacing: 3px; text-transform: uppercase; transition: 0.3s; }
        .btn-analyze:active { transform: scale(0.95); }
        .btn-analyze:disabled { background: #ccc; cursor: not-allowed; }

        /* RESULT BOX */
        #result-box { display: none; width: 100%; max-width: 500px; margin: 20px auto; padding: 40px; background: #fff; border-radius: 35px; border: 1px solid var(--border); text-align: left; }
        .res-title { font-family: 'Playfair Display', serif; color: var(--gold); font-size: 1.8rem; text-align: center; margin-bottom: 30px; }
        table { width: 100%; border-collapse: collapse; }
        td { padding: 15px 0; border-bottom: 1px solid #f5f5f5; font-size: 0.95rem; }
        .label { color: var(--gold); font-weight: 600; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px; vertical-align: top; width: 35%; }
        .value { text-align: right; font-weight: 500; }
        .note-box { background: var(--cream); padding: 20px; border-left: 5px solid var(--gold); margin-top: 25px; border-radius: 0 15px 15px 0; font-size: 0.9rem; line-height: 1.6; }
    </style>
</head>
<body>

    <div id="entry-modal">
        <div class="modal-box">
            <div class="modal-title">Müşteri Kaydı</div>
            <input type="text" id="m-ad" placeholder="Müşteri Ad Soyad" required>
            <input type="number" id="m-yas" placeholder="Müşteri Yaşı" required>
            <select id="m-cin">
                <option value="Erkek">Erkek</option>
                <option value="Kadın">Kadın</option>
            </select>
            <button class="btn-go" onclick="initSession()">Analize Geç</button>
        </div>
    </div>

    <div id="main-content">
        <div class="vogue-logo">OpticGrid</div>
        <div class="cam-container">
            <video id="input_video" playsinline></video>
            <button id="cam-switch" class="cam-btn">📸</button>
        </div>
        <button id="start-btn" class="btn-analyze">Analizi Başlat</button>

        <div id="result-box">
            <div class="res-title">Analiz Raporu</div>
            <div id="m-summary" style="text-align: center; color: #999; margin-bottom: 25px; font-style: italic;"></div>
            <table>
                <tr><td class="label">Yüz Geometrisi</td><td id="res-yuz" class="value">-</td></tr>
                <tr><td class="label">Stil Kimliği</td><td id="res-stil" class="value" style="color: var(--gold); font-weight: 600;">-</td></tr>
                <tr><td class="label">Yüz Morfolojisi</td><td id="res-morfoloji" class="value" style="text-align: left; display: block; font-size: 0.85rem; margin-top: 5px; color: #555; line-height: 1.4;">-</td></tr>
                <tr><td class="label">Köprü Mimarisi</td><td id="res-kopru" class="value" style="text-align: left; display: block; font-size: 0.85rem; margin-top: 5px; color: #555; line-height: 1.4;">-</td></tr>
            </table>
            <div class="note-box">
                <strong style="color: var(--gold);">Modern Optik Önerisi:</strong><br>
                <span id="res-oneri"></span>
            </div>
            <div style="text-align:center; margin-top: 35px;">
                <button onclick="location.reload()" style="background:none; border:none; color: var(--gold); text-decoration: underline; cursor:pointer; font-size: 0.9rem; letter-spacing: 1px;">YENİ ANALİZ BAŞLAT</button>
            </div>
        </div>
    </div>

    <script>
        let customer = {};
        const videoElement = document.getElementById('input_video');
        const startBtn = document.getElementById('start-btn');
        let currentStream = null;
        let facingMode = 'user';
        let resultsFound = null;

        function initSession() {
            customer.ad = document.getElementById('m-ad').value;
            customer.yas = document.getElementById('m-yas').value;
            customer.cin = document.getElementById('m-cin').value;

            if(!customer.ad || !customer.yas) return alert("Lütfen müşteri bilgilerini eksiksiz girin.");
            
            document.getElementById('entry-modal').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            setupCamera();
        }

        async function setupCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }
            try {
                currentStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: facingMode, width: { ideal: 1280 }, height: { ideal: 720 } } 
                });
                videoElement.srcObject = currentStream;
                videoElement.play();
                
                const camera = new Camera(videoElement, {
                    onFrame: async () => { await faceMesh.send({image: videoElement}); }
                });
                camera.start();
            } catch (err) {
                alert("Kamera başlatılamadı: " + err);
            }
        }

        document.getElementById('cam-switch').addEventListener('click', () => {
            facingMode = facingMode === 'user' ? 'environment' : 'user';
            setupCamera();
        });

        const faceMesh = new FaceMesh({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4/${file}`});
        faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.7 });
        faceMesh.onResults((res) => { resultsFound = res; });

        startBtn.addEventListener('click', async () => {
            if (!resultsFound || !resultsFound.multiFaceLandmarks || resultsFound.multiFaceLandmarks.length === 0) {
                return alert("Yüz henüz tam algılanamadı, lütfen kameraya düz bakın.");
            }

            startBtn.innerText = "ANALİZ EDİLİYOR...";
            startBtn.disabled = true;

            const lm = resultsFound.multiFaceLandmarks[0];
            const h = videoElement.videoHeight;
            const w = videoElement.videoWidth;

            const dist = (p1, p2) => Math.sqrt(Math.pow((p1.x - p2.x)*w, 2) + Math.pow((p1.y - p2.y)*h, 2));
            
            // 1. MediaPipe Noktalarından Milimetrik Ölçümler
            const yuz_uzunlugu = dist(lm[10], lm[152]);
            const elmacik_genisligi = dist(lm[234], lm[454]);
            const alin_genisligi = dist(lm[109], lm[338]);
            const cene_genisligi = dist(lm[58], lm[288]);

            const en_boy_orani = yuz_uzunlugu / elmacik_genisligi;
            const ust_alt_orani = alin_genisligi / cene_genisligi;

            // 2. Detaylı Açı ve Kemik Analizi Filtresi (Herkesin Oval Çıkmasını Engeller)
            let gonderilecek_en_boy = en_boy_orani;
            let gonderilecek_ust_alt = ust_alt_orani;

            // Alın ve çene genişliği birbirine çok yakınsa yüz köşelidir (Kare veya Dikdöttgen)
            if (ust_alt_orani < 1.08) {
                if (en_boy_orani > 1.2) {
                    gonderilecek_en_boy = 1.15; // Python bunu otomatik "Dikdörtgen Yüz" algılayacak
                } else {
                    gonderilecek_en_boy = 1.10; // Python bunu otomatik "Kare Yüz" algılayacak
                }
            }
            // Alın geniş, çene belirgin şekilde darsa bu bir Kalp Yüzdür
            else if (alin_genisligi > elmacik_genisligi * 0.95 && ust_alt_orani > 1.15) {
                gonderilecek_en_boy = 1.12;  
                gonderilecek_ust_alt = 1.20; // Python bunu "Kalp Yüz" algılayacak
            }
            // Yüzün eni ve boyu birbirine yakınsa ama çene sivri değilse Yuvarlak Yüzdür
            else if (en_boy_orani < 1.12 && ust_alt_orani >= 1.08) {
                gonderilecek_en_boy = 0.98; // Python bunu otomatik "Yuvarlak Yüz" algılayacak
            }
            // Sadece bu filtrelerden geçebilen gerçek dengeli yüzler "Oval" kalır.

            // 3. Sunucuya Akıllı Verileri Gönderme
            try {
                const response = await fetch('/scan_and_save', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ 
                        ad: customer.ad, 
                        yas: customer.yas, 
                        cinsiyet: customer.cin,
                        en_boy_orani: gonderilecek_en_boy,  
                        ust_alt_orani: gonderilecek_ust_alt  
                    })
                });

                const result = await response.json();

                if (result.status === "success") {
                    // Temel verileri ekrana basıyoruz
                    document.getElementById('res-yuz').innerText = result.yuz_tipi;
                    document.getElementById('res-oneri').innerText = result.oneri;
                    document.getElementById('m-summary').innerText = `Müşteri: ${customer.ad} | Yaş: ${customer.yas}`;

                    // Yüz tipine göre o boşlukları frontend'de zengin metinlerle dolduruyoruz
                    let stil = "", morfoloji = "", kopru = "";

                    if (result.yuz_tipi === "Oval Yüz") {
                        stil = "The Timeless Icon (Zamansız İkon)";
                        morfoloji = "Mevcut mükemmel simetriyi ve doğal yüz hatlarını korumak esastır. Ekstra bir keskinleştirmeye ihtiyaç duymaz.";
                        kopru = "Standart / Anatomik Köprü. Yüzün doğal dengesini bozmayan, burun kemerine tam oturan tasarımlar idealdir.";
                    } 
                    else if (result.yuz_tipi === "Diamond Yüz") {
                        stil = "The Avant-Garde Sculptor (Avangart Heykeltıraş)";
                        morfoloji = "Dar alın ve dar çene yapısına tezat oluşturan belirgin elmacık kemiklerinin yarattığı yüksek dramatik etkiyi dengelemek hedeflenir.";
                        kopru = "Kalın veya Belirgin Üst Köprü. Dikkatleri yüzün en geniş yeri olan elmacıklardan alıp göz hizasına çekecek tasarımlar.";
                    }
                    else if (result.yuz_tipi === "Yuvarlak Yüz") {
                        stil = "Architectural Modernism (Mimari Modernizm)";
                        morfoloji = "Yüzün yumuşak hatlarını dengelemek için net kontrast yaratılmalıdır. Genişlik ve boy oranı yakın olduğundan dikey algı oluşturulur.";
                        kopru = "Yüksek ve Düz Yerleşimli Köprü. Gözleri daha ayrık, burnu daha uzun ve yüzü daha ince gösteren hatlar tercih edilmelidir.";
                    } 
                    else if (result.yuz_tipi === "Kalp Yüz") {
                        stil = "Minimalist Avant-Garde (Minimalist Avangart)";
                        morfoloji = "Geniş alın bölgesini dengelerken, aşağıya doğru daralan ve sivrileşen çene yapısını daha orantılı göstermek amaçlanır.";
                        kopru = "İnce Metal / Belirsiz Köprü. Alındaki görsel ağırlığı aşağıya çekerek dikkati burun ve çene hattına dağıtan tasarımlar.";
                    } 
                    else if (result.yuz_tipi === "Kare Yüz") {
                        stil = "Soft Tailoring / Quiet Luxury (Sade Lüks)";
                        morfoloji = "Oldukça güçlü ve belirgin olan çene hatlarını, elmacık kemiği köşelerini zarafetle yumuşatmak ve ifadeyi dengelemek hedeflenir.";
                        kopru = "Anahtarlık (Keyhole) Köprü. Sert hatları kırmak amacıyla burnu yumuşakça saran ve odak noktasını gözlere çeken tasarımlar.";
                    } 
                    else { // Dikdörtgen Yüz
                        stil = "Bold & Cinematic (Görkemli Sinematik)";
                        morfoloji = "Yüzün dikey uzunluğunu yatay olarak kesmek, yüzü daha kısa ve kompakt göstererek ideal oranlara yaklaştırmak ana stratejidir.";
                        kopru = "Kalın ve Alçak Yerleşimli Köprü. Yüzü ortadan bölerek dikey derinliği kıran và uzunluğu illüzyonla azaltan belirgin köprüler.";
                    }

                    // Oluşturduğumuz bu zengin açıklamaları tablodaki yerlerine yazdırıyoruz
                    document.getElementById('res-stil').innerText = stil;
                    document.getElementById('res-morfoloji').innerText = morfoloji;
                    document.getElementById('res-kopru').innerText = kopru;
                    
                    // Sonuç kutusunu göster, kamerayı kapat
                    document.getElementById('result-box').style.display = 'block';
                    document.querySelector('.cam-container').style.display = 'none';
                    startBtn.style.display = 'none';
                    
                    if (currentStream) {
                        currentStream.getTracks().forEach(track => track.stop());
                    }
                } else {
                    alert("Hata: " + result.message);
                    startBtn.innerText = "Analizi Başlat";
                    startBtn.disabled = false;
                }

            } catch (error) {
                alert("Sunucuya bağlanılamadı.");
                startBtn.innerText = "Analizi Başlat";
                startBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
